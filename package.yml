package: cloud.lazycat.app.hellolpk
version: 1.0.0
name: 环境探针
description: 一键读取浏览器与网关的真实运行环境，附带可持久化的本地便签，用于确认应用部署状态。
author: wans
license: MIT
homepage: https://lazycat.cloud/
min_os_version: 1.5.0
locales:
  zh-CN:
    name: 环境探针
    description: 一键读取浏览器与网关的真实运行环境，附带可持久化的本地便签，用于确认应用部署状态。
    usage: |
      打开应用即可看到当前设备的运行环境信息，包括访问域名、客户端平台、浏览器与版本、
      视口与屏幕尺寸、语言与时区、网络状态。

      页面下方的本地便签可以写入文字并保存，内容存放在浏览器本地，刷新页面或重启应用后仍然保留，
      每次保存会显示保存时间。

      「重新读取」按钮用于在改变窗口大小或网络状态后刷新环境信息；
      「复制全部信息」按钮会把当前环境信息整理成 JSON 复制到剪贴板。
  en-US:
    name: Environment Probe
    description: One-tap view of the real browser and gateway environment, plus a persistent local note for confirming deployment status.
    usage: |
      Open the app to see the runtime details of the current device: access domain, client
      platform, browser and version, viewport and screen size, language and timezone, and
      network status.

      The local note below can be written and saved. It is kept in the browser, so it survives
      page reloads and app restarts, and each save shows the saved time.

      Refresh re-collects the environment details after you resize the window or change the
      network; Copy all copies the current details as JSON to the clipboard.
