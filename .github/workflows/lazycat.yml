name: LazyCat LPK

# tag 驱动：推 v* tag 就把 package.yml 版本改成该 tag、构建 LPK、发 Release、提交官方商店。
# 定时任务对 git 版本源不做上游发现（本工程无上游），保留它只为定期验证配置与构建仍然可用。
on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "auto 自动判断 / check 只检查 / build 只构建 / publish-official 只提交官方商店"
        type: choice
        options:
          - auto
          - check
          - build
          - publish-official
        default: auto
      dry-run:
        description: "只演练不写文件、不发布"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  lazycat:
    # 固定提交，不用浮动 v1 标签，保证构建行为可复现
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@3dabca95f6eb0c3a6c4fc889631b13a055852912
    with:
      operation: ${{ inputs.operation || 'auto' }}
      config: .github/lazycat-action.yml
      dry-run: ${{ inputs.dry-run || false }}
      versioned-release-asset: true
    secrets:
      # 本仓库用 lzc-cli 会话 token（X-User-Token 协议）而非开发者中心 PAT，
      # 这是上游文档允许的兼容路径；两者不要同时映射。
      LAZYCAT_TOKEN: ${{ secrets.LAZYCAT_TOKEN }}
