# LazyCat GitHub Action 配置：hellolpk 的 LPK 自动构建与官方商店更新
#
# 与 tracearr/twikoo 那批「跟随上游镜像」的仓库不同，hellolpk 是自研源码工程、没有上游镜像，
# 所以 version_source 用 git：版本由本仓库的 tag 决定，tag v1.0.1 就产出 1.0.1。
# 两个决定仍然分开：version_source 决定 package.yml 的版本，images[] 决定 Manifest 里改哪些 image
# 字段 —— 本工程没有镜像，images 保持为空。
version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  # 必须是固定文件名且以 .lpk 结尾：Action 用它做校验与 Release 资产，
  # 不要写成 dist/*.lpk 这种随版本变化的名字。
  output: out/hellolpk.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git

build:
  toolchains:
    - kind: node
      version: "22"
  # buildscript 是 lzc-build.yml 里的 `npm install && npm run build`，产出 dist/ 静态资源
  run_buildscript: true

images: []

stores:
  # 应用 cloud.lazycat.app.hellolpk 已建档、1.0.0 已在审核中（#20754），
  # 因此 create_if_missing 必须为 false，也不能带 application 元数据块。
  official:
    enabled: true
    continue_if_newer_version: true
    skip_if_version_exists: true
    create_if_missing: true
    # 应用信息（建档时必填的那部分）。配置校验要求 application 块只能与
    # create_if_missing: true 同时出现；记录已存在时 create 会被跳过，信息仍会被上传。
    # 没有这个块，HasSubmissionInfo() 为 false，
    # Action 会跳过应用信息上传，review/create 就被服务端拒成
    # 「应用信息至少需要支持桌面端或移动端之一」。
    application:
      language: zh
      name: 环境探针
      brief: 一键读取浏览器与网关的真实运行环境，附带可持久化的本地便签。
      description: >-
        打开应用即可看到当前设备的运行环境：访问域名、客户端平台、浏览器与版本、
        视口与屏幕尺寸、语言与时区、网络状态。页面下方的本地便签可写入并保存，
        内容存放在浏览器本地，刷新或重启后仍然保留；每次保存会显示保存时间。
        另有「重新读取」与「复制全部信息」两个按钮，便于在改窗口或网络后复核。
      keywords: 环境,探针,调试,便签,运行环境
      source: https://github.com/Wans-bot/hellolpk-lzcapp
      source_author: Wans
      support_pc: true
      support_mobile: true
    changelog_locales: [zh, en]
  private:
    enabled: false
